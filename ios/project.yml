name: MagnetPlayer
options: { bundleIdPrefix: com.example, deploymentTarget: { iOS: "16.0" } }
configs: { Debug: debug, Release: release }
configFiles: { Debug: Config/Development.xcconfig, Release: Config/Production.xcconfig }
settings:
  base: { SWIFT_VERSION: "5.9", MARKETING_VERSION: "1.0.0", CURRENT_PROJECT_VERSION: "1", GENERATE_INFOPLIST_FILE: NO }
targets:
  MagnetPlayer:
    type: application
    platform: iOS
    sources: [MagnetPlayer]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: com.example.magnetplayer, INFOPLIST_FILE: MagnetPlayer/Resources/Info.plist } }
  MagnetPlayerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MagnetPlayerTests]
    dependencies: [{ target: MagnetPlayer }]
    settings: { base: { GENERATE_INFOPLIST_FILE: YES, BUNDLE_LOADER: "$(TEST_HOST)", TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MagnetPlayer.app/MagnetPlayer" } }
schemes:
  MagnetPlayer:
    build: { targets: { MagnetPlayer: all } }
    test: { targets: [MagnetPlayerTests] }

